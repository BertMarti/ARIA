<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b12">
<title>ARIA - Acceso</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
<main class="login-box">
  <img class="login-logo" src="/static/icon.svg" alt="" width="72" height="72">
  <h1>ARIA</h1>
  <p class="sub">Centro de control del laboratorio · <a href="/hola">¿Qué es ARIA?</a></p>
  <form id="form-login" method="post" action="/login" autocomplete="on">
    <label>Usuario o email <input name="usuario" autocomplete="username" required autofocus></label>
    <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primario">Entrar</button>
    <p id="error" class="error" hidden></p>
  </form>
  <form id="form-codigo" method="post" action="/login/codigo" autocomplete="off" hidden>
    <p class="login-paso">Verificación en dos pasos</p>
    <label>Código de tu app de autenticación <input name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="16" required placeholder="123 456"></label>
    <button type="submit" class="primario">Verificar</button>
    <p class="sub login-ayuda">¿Sin el móvil? Escribe uno de tus códigos de recuperación.</p>
    <p id="error-codigo" class="error" hidden></p>
    <a href="/login" class="sub">Volver</a>
  </form>
</main>
<script src="/static/login.js"></script>
</body>
</html>
