# Publica el escaparate estático de ARIA (carpeta site/) en GitHub Pages: https://bertmarti.github.io/ARIA/
# Solo copia site/ y las imágenes públicas de docs/img que usa la web (capturas de la demo con datos ficticios).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Montar la web
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r site _site
          mkdir -p _site/img/ping
          cp docs/img/banner-claro.svg docs/img/banner-oscuro.svg _site/img/
          cp docs/img/ping/*.svg _site/img/ping/
          for f in inicio chat hud agenda red informacion control-parental movil-inicio movil-hud; do
            cp "docs/img/captura-$f.png" _site/img/
          done
          touch _site/.nojekyll
          # Toda imagen que pida la web tiene que existir en el artefacto
          grep -ho 'img/[A-Za-z0-9/._-]*\.\(png\|svg\)' _site/*.html _site/*.js | sort -u | while read -r ruta; do
            test -f "_site/$ruta" || { echo "Falta $ruta"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
