# Conector de Cloudflare Tunnel: publica ARIA, SHIELD-DNS y HEIMDALL en tu-dominio.com
# sin abrir puertos. El token se lee de ../cloudflare.env (CLOUDFLARE_TUNNEL_TOKEN).
name: cloudflare
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Falta CLOUDFLARE_TUNNEL_TOKEN en ../cloudflare.env}
    networks:
      - aria
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
  # Mantiene vpn.<dominio> apuntando a tu IP pública (la operadora puede cambiarla).
  # Sin proxy de Cloudflare: la VPN (WireGuard, UDP) va directa a tu router.
  ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    restart: unless-stopped
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Falta CLOUDFLARE_API_TOKEN}
      DOMAINS: vpn.${DOMINIO:?Falta DOMINIO}
      PROXIED: "false"
      IP6_PROVIDER: none
      UPDATE_CRON: "@every 5m"

networks:
  aria:
    name: aria_default
    external: true
