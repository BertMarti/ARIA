# ARIA - asistente local estilo "Jarvis". Proyecto de Compose: aria
name: aria

services:
  ollama:
    image: ollama/ollama:latest
    container_name: aria-ollama
    restart: unless-stopped
    # No se publica en el host: solo la app accede por la red interna.
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: ${OLLAMA_MEM_LIMIT:-5g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Metabuscador interno para la búsqueda en internet de ARIA. Sin puertos publicados:
  # solo la app lo alcanza (http://searxng:8080) por la red de Compose.
  searxng:
    image: searxng/searxng:latest
    container_name: aria-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: http://searxng:8080/
      GRANIAN_WORKERS: "1"
      GRANIAN_BLOCKING_THREADS: "2"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SEARXNG_MEM_LIMIT:-384m}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: ./app
    image: aria-app:local
    container_name: aria-app
    restart: unless-stopped
    user: "${ARIA_UID:-1000}:${ARIA_GID:-1000}"
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: aria-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ARIA_LAN_IP: ${ARIA_LAN_IP:-127.0.0.1}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
