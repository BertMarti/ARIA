# ARIA 3: compila las APK de Android SIN FIRMAR. La llave de firma no sale nunca de la máquina de ARIA:
# herramientas/app/publicar.sh descarga estos artefactos, los firma allí y los publica en GitHub Releases.
name: Android

on:
  push:
    branches: [main, aria3]
    paths: ["movil/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: movil/aria/package-lock.json

      - name: ARIA (Capacitor)
        working-directory: movil/aria
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../../../salida
          cp app/build/outputs/apk/release/*.apk ../../../salida/aria-sin-firmar.apk

      - name: ARIA Lite (TWA)
        if: hashFiles('movil/aria-lite/build.gradle') != ''
        working-directory: movil/aria-lite
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk ../../salida/aria-lite-sin-firmar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-sin-firmar
          path: salida/*.apk
          retention-days: 14

  # Prueba de humo en un Android emulado: instala las APK (sin firmar no se pueden instalar, así que se firman con una llave
  # de usar y tirar SOLO para esta prueba), las abre, busca cierres inesperados en logcat y guarda capturas de pantalla.
  emulador:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-sin-firmar
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Firmar con una llave de prueba (desechable)
        run: |
          keytool -genkeypair -keystore prueba.jks -storepass prueba -keypass prueba -alias prueba -keyalg RSA \
            -keysize 2048 -validity 1 -dname "CN=prueba" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in apk/*.apk; do
            "$BT/apksigner" sign --ks prueba.jks --ks-pass pass:prueba --out "${f%-sin-firmar.apk}-prueba.apk" "$f"
          done
          ls -la apk
      - name: Abrir las apps en un Android 13 emulado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            mkdir -p capturas
            adb install -r apk/aria-prueba.apk
            adb install -r apk/aria-lite-prueba.apk || true
            adb logcat -c
            adb shell am start -n io.github.bertmarti.aria/.MainActivity
            sleep 15
            adb exec-out screencap -p > capturas/aria-inicio.png
            # Otros caminos de entrada: atajos con acción, compartir texto y abrirla como asistente
            for accion in hablar nota hud compartir cambiar; do
              adb shell am start -n io.github.bertmarti.aria/.MainActivity --es accion $accion
              sleep 3
            done
            adb shell am start -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "Prueba compartida" \
              -n io.github.bertmarti.aria/.MainActivity
            sleep 3
            adb shell am start -a android.intent.action.ASSIST -p io.github.bertmarti.aria || true
            sleep 4
            adb exec-out screencap -p > capturas/aria-asistente.png
            adb shell monkey -p io.github.bertmarti.aria.lite -c android.intent.category.LAUNCHER 1
            sleep 8
            adb exec-out screencap -p > capturas/aria-lite-config.png
            adb shell cmd statusbar expand-settings || true
            sleep 3
            adb exec-out screencap -p > capturas/ajustes-rapidos.png
            adb logcat -d > capturas/logcat.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime: Process: io.github.bertmarti" capturas/logcat.txt; then echo "La app se ha cerrado"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-emulador
          path: capturas
          retention-days: 7
